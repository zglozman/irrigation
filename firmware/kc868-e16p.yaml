substitutions:
  device_name: irrigation-controller
  # Hard on-device cap: a valve can never stay open longer than this, even if
  # the cloud scheduler crashes after sending ON or connectivity drops before
  # the OFF arrives. The cloud's scheduled OFF is the normal path.
  max_valve_runtime: 60min

esphome:
  name: ${device_name}
  friendly_name: Irrigation Controller
  # Version drives the remote OTA update check (manifest vs running build).
  project:
    name: "zglozman.irrigation"
    version: "1.2.2"
  includes:
    - wifi_scan_helper.h
  on_boot:
    - priority: 200
      then:
        - lambda: |-
            // Without saved credentials the wifi component's connect state
            // machine flaps the network stack (and the MQTT session with it).
            // Keep it disabled until provisioning saves credentials.
            if (!wifi::global_wifi_component->has_sta() && !wifi::global_wifi_component->is_disabled()) {
              wifi::global_wifi_component->disable();
              ESP_LOGI("wifiprov", "no credentials; wifi component disabled");
            }

# ESP-IDF framework is required for MQTT mutual-TLS (client certificates)
# used to authenticate to AWS IoT Core.
esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

# Local Home Assistant / native API — kept for local debugging.
# reboot_timeout must be 0s: with no HA client ever connecting, the default
# watchdog would reboot the board every ~15 minutes.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# Two OTA paths:
#  - esphome: push from the LAN via the esphome CLI (bench/dev updates)
#  - http_request: device pulls firmware from a URL (cloud OTA) — paired with
#    the update: component below, which checks an S3-hosted manifest so the
#    board can be updated remotely without LAN access.
ota:
  - platform: esphome
    password: !secret ota_password
  - platform: http_request

http_request:

update:
  - platform: http_request
    name: Firmware Update
    source: !secret ota_manifest_url

# Board is PoE/Ethernet-first, with WiFi as fallback
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: 17
  phy_addr: 0

# WiFi fallback (no hardcoded credentials; persisted via MQTT commands).
# Radio stays OFF at boot: an idle credential-less wifi component flaps the
# network stack and drops the MQTT session every few minutes. Provisioning
# scans use the direct-driver helper (wifi_scan_helper.h); the component is
# enabled only once credentials are saved.
wifi:
  enable_on_boot: false
  ap:
    ssid: "${device_name} Setup"
    password: !secret ota_password

# Network priority: ethernet preferred, wifi fallback
network:
  priority:
    - ethernet
    - wifi

# AWS IoT Core over mutual TLS. The cloud scheduler publishes ON/OFF to
# ${device_name}/switch/relay_N/command; ESPHome publishes state and
# availability (birth/last-will) automatically.
mqtt:
  broker: !secret aws_iot_endpoint
  port: 8883
  discovery: false
  # Must be off for AWS IoT Core: discover_ip subscribes to esphome/discover
  # and esphome/ping/* at QoS 2, which IoT Core rejects by dropping the
  # entire connection.
  discover_ip: false
  topic_prefix: ${device_name}
  # Must match the client-id allowed by the IoT policy — ESPHome's default
  # appends a MAC suffix, which IoT Core would reject on Connect.
  client_id: ${device_name}
  certificate_authority: !secret aws_root_ca
  client_certificate: !secret aws_iot_device_cert
  client_certificate_key: !secret aws_iot_device_key
  on_connect:
    - lambda: |-
        // Publish current network status on connect
        std::string active = "unknown";

        if (wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected()) {
          active = "wifi";
        } else if (ethernet::global_eth_component != nullptr && ethernet::global_eth_component->is_connected()) {
          active = "ethernet";
        }

        std::string ts = str_sprintf("%lld", (long long) time(nullptr));
        std::string payload = "{\"active\":\"" + active + "\",\"ts\":" + ts + "}";
        mqtt::global_mqtt_client->publish("irrigation-controller/wifi/status", payload, 0, true);
  on_message:
    - topic: irrigation-controller/wifi/scan
      then:
        - lambda: |-
            // Direct driver scan (see wifi_scan_helper.h). The ESPHome wifi
            // component stays disabled so its connect state machine cannot
            // abort the scan or flap MQTT.
            bool ok = wifiprov::start_scan();
            ESP_LOGI("wifiprov", "scan request: start_scan=%d", (int) ok);
            id(wifi_scan_countdown) = 10;  // 10 ticks x 2s = 20s window
    - topic: irrigation-controller/wifi/set
      then:
        - lambda: |-
            std::string payload_str = x;
            // Simple JSON parsing for {"ssid":"...","password":"..."}
            size_t ssid_start = payload_str.find("\"ssid\":\"");
            size_t password_start = payload_str.find("\"password\":\"");

            if (ssid_start != std::string::npos && password_start != std::string::npos) {
              ssid_start += 8; // Length of "\"ssid\":\""
              size_t ssid_end = payload_str.find("\"", ssid_start);

              password_start += 13; // Length of "\"password\":\""
              size_t password_end = payload_str.find("\"", password_start);

              if (ssid_end != std::string::npos && password_end != std::string::npos) {
                std::string ssid(payload_str.substr(ssid_start, ssid_end - ssid_start));
                std::string password(payload_str.substr(password_start, password_end - password_start));

                // The direct-driver scan must release the radio before the
                // component takes over.
                wifiprov::stop();

                // Save credentials and bring the component up as a real
                // fallback interface — with credentials it connects instead
                // of flapping.
                id(wifi_cfg_ssid) = ssid;
                id(wifi_error).clear();
                id(wifi_fail_ticks) = 0;
                wifi::global_wifi_component->save_wifi_sta(ssid, password);
                if (wifi::global_wifi_component->is_disabled()) {
                  wifi::global_wifi_component->enable();
                }

                // Publish confirmation (never echo password)
                std::string confirm = "{\"configured\":\"" + ssid + "\",\"ts\":" + str_sprintf("%lld", (long long) time(nullptr)) + "}";
                mqtt::global_mqtt_client->publish("irrigation-controller/wifi/status", confirm, 0, true);
              }
            }

globals:
  - id: wifi_scan_countdown
    type: int
    restore_value: no
    initial_value: '0'
  # Bringing the radio up briefly drops the MQTT session, so scan results are
  # parked here and published once the session is back.
  - id: wifi_scan_json
    type: std::string
    restore_value: no
  - id: wifi_scan_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_cfg_ssid
    type: std::string
    restore_value: no
  - id: wifi_error
    type: std::string
    restore_value: no
  - id: wifi_fail_ticks
    type: int
    restore_value: no
    initial_value: '0'

# Web dashboard on the device's IP — lets you flip relays from a browser
# with zero cloud/backend involved, good for bench testing.
web_server:
  port: 80

interval:
  # WiFi scan result publisher: polls the direct-driver scan and publishes
  # as soon as results land (or an empty list when the window expires).
  - interval: 2s
    then:
      - lambda: |-
          // Deferred publish: the radio bring-up drops MQTT briefly, so
          // results wait here until the session is back.
          if (id(wifi_scan_pending) && mqtt::global_mqtt_client->is_connected()) {
            ESP_LOGI("wifiprov", "publishing parked scan results");
            mqtt::global_mqtt_client->publish("irrigation-controller/wifi/networks", id(wifi_scan_json), 0, true);
            id(wifi_scan_pending) = false;
            id(wifi_scan_json).clear();
          }

          if (id(wifi_scan_countdown) <= 0) return;
          id(wifi_scan_countdown) -= 1;

          // Retry the driver scan mid-window if nothing has landed yet.
          if (id(wifi_scan_countdown) == 5 && wifiprov::result_count() == 0) {
            ESP_LOGI("wifiprov", "mid-window rescan");
            wifiprov::start_scan();
            return;
          }

          // Collect as soon as results exist, or when the window expires.
          bool have = wifiprov::result_count() > 0;
          if (!have && id(wifi_scan_countdown) != 0) return;
          ESP_LOGI("wifiprov", "scan finished (count=%d, tick=%d); parking results for publish", wifiprov::result_count(), id(wifi_scan_countdown));
          id(wifi_scan_countdown) = 0;

          id(wifi_scan_json) = wifiprov::collect_json();
          id(wifi_scan_pending) = true;
          // Radio back off unless the component owns it (post-provisioning);
          // stopping it also lets Ethernet MQTT re-establish immediately.
          if (wifi::global_wifi_component->is_disabled()) {
            wifiprov::stop();
          }

  # Periodic network status heartbeat + WiFi-failure watchdog: endless failed
  # WPA handshakes churn the network stack and flap the Ethernet MQTT session,
  # so after ~90s of failures (with Ethernet healthy) WiFi is turned back off
  # and the error surfaced to the UI.
  - interval: 30s
    then:
      - lambda: |-
          bool wifi_up = wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected();
          bool eth_up = ethernet::global_eth_component != nullptr && ethernet::global_eth_component->is_connected();

          if (wifi_up) {
            id(wifi_fail_ticks) = 0;
            id(wifi_error).clear();
          } else if (!wifi::global_wifi_component->is_disabled() &&
                     wifi::global_wifi_component->has_sta() && eth_up) {
            id(wifi_fail_ticks) += 1;
            if (id(wifi_fail_ticks) >= 3) {
              ESP_LOGW("wifiprov", "wifi failing to connect; disabling to protect ethernet session");
              wifi::global_wifi_component->disable();
              id(wifi_error) = "connect failed - check password and try again";
              id(wifi_fail_ticks) = 0;
            }
          }

          std::string active = wifi_up ? "wifi" : (eth_up ? "ethernet" : "unknown");
          std::string payload = "{\"active\":\"" + active + "\"";
          if (!id(wifi_cfg_ssid).empty()) payload += ",\"configured\":\"" + id(wifi_cfg_ssid) + "\"";
          if (!id(wifi_error).empty()) payload += ",\"error\":\"" + id(wifi_error) + "\"";
          payload += ",\"ts\":" + str_sprintf("%lld", (long long) time(nullptr)) + "}";
          mqtt::global_mqtt_client->publish("irrigation-controller/wifi/status", payload, 0, true);

i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  id: bus_a

pcf8574:
  - id: pcf_out_1_8
    address: 0x21
  - id: pcf_out_9_16
    address: 0x25
  - id: pcf_in_1_8
    address: 0x22
  - id: pcf_in_9_16
    address: 0x24

switch:
  - platform: gpio
    name: "Relay 1"
    id: relay_1
    pin: {pcf8574: pcf_out_1_8, number: 0, mode: OUTPUT, inverted: true}
    on_turn_on:
      - delay: ${max_valve_runtime}
      - switch.turn_off: relay_1
  - platform: gpio
    name: "Relay 2"
    id: relay_2
    pin: {pcf8574: pcf_out_1_8, number: 1, mode: OUTPUT, inverted: true}
    on_turn_on:
